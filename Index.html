function payBr(){const b=BR[S.br],l=S.bl2||0,sal=Math.round(b.w[l]*2*(1+Math.min(.5,(S.tot||0)/400)));if(S.day%14==7){const a=Math.round(sal*((S.kt||0)>=4?.3:.15));S.money+=a;S.pa=a;fl('💵 аванс +'+a,11)}else{const fin=Math.max(0,Math.round(sal*perfF())-(S.pa||0));S.money+=fin;S.pa=0;S.kt=0;S.ks=0;S.kd=0;S.pr=0;rain={t0:now(),e:'💰'};fl('💰 зарплата +'+fin,11)}if(S.cr)S.cr=Math.max(0,S.cr-.25)}
function skipDay(){S.st=(S.st||0)+1;S.mp=Math.max(0,(S.mp||0)-4);fl('🚫 прогул',10)}
const finish3=finish;finish=function(k,s){if(!S.home){S.td=(S.td||0)+1;S.ls=0;S.kt=(S.kt||0)+1;S.ks=(S.ks||0)+s;S.mp=Math.min(recNeed()+10,Math.max(0,(S.mp||0)+(s==3?2:s==2?1:s==0?-2:0)))}finish3(k,s);if(!S.home&&!S.rec&&!(S.pr>=1)&&(S.rank<5||S.br)&&(S.mp||0)>=recNeed()){S.rec=1;S.mp=0;fl('📝 рекомендация!',10)}};
const sleep0=sleep;sleep=function(){if(busy||S.en>=100||S.ls)return;S.ls=1;sleep0()};
const hire2=hire;hire=function(v,st){const up=v.p>S.rank;hire2(v,st);if(up){S.rec=0;S.mp=0}if(!v.stay){S.pr=up?1:0;S.sal=calcSal(v.p,v.ci,st);S.pa=0;S.ad=0;S.c0=ctr(v.ci);S.kt=0;S.ks=0;S.kd=0;S.wd=0;S.ge=0}else S.pr=1;S.lr=S.rank};
const exam5=exam;exam=function(){if(busy)return;if(S.rank<5&&!S.home){if(!S.rec){fl('📝 нужна рекомендация',9);return}if(S.pr>=1){fl('🔒 уже было',9);return}}exam5()};
const iv4=interview;interview=function(k){const v=S.vac&&S.vac[k];if(v&&v.p>S.rank){if(!S.rec){fl('📝 нужна рекомендация',9);return}if(!S.home&&S.pr>=1){fl('🔒 уже было',9);return}}iv4(k)};
const bp1=brPromo;brPromo=function(){if(!S.br||busy)return;if(!S.rec){fl('📝 нужна рекомендация',9);return}if(S.pr>=1){fl('🔒 уже было',9);return}const l0=S.bl2||0;bp1();if((S.bl2||0)>l0){S.rec=0;S.pr=1;S.mp=0}};
const sb0=startBr;startBr=function(k){sb0(k);S.pr=0;S.rec=0;S.mp=0;S.kt=0;S.ks=0;S.kd=0;S.pa=0};
const ETA3=ETA;ETA=function(){ETA3();const w=!S.home&&(S.rank<5||S.br);if(w)$('#ladder').insertAdjacentHTML('beforeend',`<div style='margin:0 0 14px;font-size:8px;text-align:center;line-height:1.8'>📝 ${S.rec?'есть рекомендация ✔'+(S.pr>=1?' (повышение было)':''):'заслуги '+(S.mp||0)+'/'+recNeed()}<br>💵 Эффективность ${Math.round(perfF()*100)}%${S.pa?' · аванс ✔':''}</div>`);
const sl=document.querySelector('#act button[aria-label=Сон]');if(sl&&(S.en>=100||S.ls))sl.disabled=true;
const xb=document.querySelector('#act button[aria-label=Экзамен],#act button[aria-label=Повышение]');if(xb&&!S.home&&(!S.rec||S.pr>=1))xb.disabled=true};
function payTotal(){const sal=S.sal||calcSal(S.rank,S.co||0,S.sl==null?1:S.sl),c0=S.c0||S.cl||15;return Math.round(sal/c0*Math.min(S.sd||0,S.cl||15)*perfF())}
function settle(){if(S.home||S.br)return 0;const fin=Math.max(0,payTotal()-(S.pa||0));S.ge=(S.ge||0)+fin;S.pa=0;S.ad=0;return fin}
function stmSnap(why){const sal=S.sal||calcSal(S.rank,S.co||0,S.sl==null?1:S.sl),total=payTotal(),adv=S.pa||0;return{why,sal,c0:S.c0||S.cl||15,d:Math.min(S.sd||0,S.cl||15),cl:S.cl||15,eff:Math.round(perfF()*100),adv,total,fin:Math.max(0,total-adv)}}
function showStm(x){const s=$('#job');PNL='x';s.hidden=false;s.innerHTML=hdr2()+`<div class='cert' style='width:100%;display:block;font-size:8px'><b>🧾 РАСЧЁТНАЯ ВЕДОМОСТЬ</b><br>${x.why}<br>📅 Отработано: ${x.d} из ${x.cl} дн.<br>💵 Оклад: ${x.sal} ₽ за ${x.c0} дн.<br>⚙ Эффективность: ${x.eff}%<br>➕ Начислено: ${x.total} ₽<br>➖ Аванс: ${x.adv} ₽<br><b>💰 К выплате: ${x.fin} ₽</b></div>`;s.scrollIntoView({behavior:'smooth',block:'nearest'})}
const goHome3=goHome;goHome=function(){const x=stmSnap('Контракт завершён');goHome3();showStm(x)};
const fire1=fire;fire=function(){if(S.home)return;const x=stmSnap('Увольнение');fire1();showStm(x)};
const hire3=hire;hire=function(v,st){const x=!S.home&&!S.br&&!v.stay?stmSnap('Переход на другое судно'):null;hire3(v,st);if(x)showStm(x)};
const sb1=startBr;startBr=function(k){const x=!S.home&&!S.br?stmSnap('Смена карьеры'):null;sb1(k);if(x)showStm(x)};
const ETA4=ETA;ETA=function(){ETA4();if(S.home)return;let t;if(S.br){const left=7-(S.day%7),m=S.day+left;t=`💵 ${m%14==7?'Аванс':'Зарплата'} через ${left} дн.`}else{const sd=S.sd||0,cl=S.cl||15;t=`💵 Аванс: ${S.ad?'✔ получен':'через '+Math.max(0,8-sd)+' дн.'}<br>💰 Расчёт: ~${Math.max(0,payTotal()-(S.pa||0))} ₽ через ${Math.max(0,cl-sd)} дн.`}
$('#ladder').insertAdjacentHTML('beforeend',`<div style='margin:0 0 14px;font-size:8px;text-align:center;line-height:1.8;border:3px dashed #d4a017;padding:6px'>${t}</div>`)};
ui();menu(true);requestAnimationFrame(loop);
</script></body></html>
